<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>K·AI API</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- Header -->
        <header>
            <span class="logo">K·AI</span>
            <span class="tag">API</span>
        </header>

        <main>
            <!-- Intro -->
            <section class="intro">
                <h1>K·AI API</h1>
                <p>The data behind the K·AI website. Click a request below to see what it returns.</p>
            </section>

            <!-- Requests -->
            <section class="requests">
                <a href="api/tools" class="request">
                    <span class="method">GET</span>
                    <div>
                        <h2>All Tools</h2>
                        <p>/api/tools</p>
                        <p>Returns every AI tool with its name, category, description, price, platform, and image.</p>
                    </div>
                </a>
            </section>

            <!-- Images -->
            <section class="images">
                <h2>Tool images</h2>
                <div class="image-grid">
                    <img src="images/study.png" alt="Study">
                    <img src="images/codefixer.png" alt="Code Fixer">
                    <img src="images/task.jpg" alt="Task">
                    <img src="images/write.png" alt="Write">
                    <img src="images/practice.jpg" alt="Practice">
                    <img src="images/debugger.png" alt="Debugger">
                    <img src="images/report.png" alt="Report">
                    <img src="images/creation.jpg" alt="Creation">
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; Kevin Beni</p>
        </footer>
    </body>
</html>
